plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

// A private properties file preserves the maintainer's existing signing identity.
// CI can still build test APKs without receiving any signing credentials.
def signingPropertiesPath = providers.gradleProperty("releaseSigningProperties")
        .orElse(providers.environmentVariable("FLUXDOWN_SIGNING_PROPERTIES"))
def releaseSigning = new Properties()
if (signingPropertiesPath.isPresent()) {
    def signingFile = file(signingPropertiesPath.get())
    if (!signingFile.isFile()) throw new GradleException("Release signing properties file is missing")
    signingFile.withInputStream { releaseSigning.load(it) }
    ["storeFile", "storePassword", "keyAlias", "keyPassword"].each {
        if (!releaseSigning.getProperty(it)) throw new GradleException("Missing signing property: " + it)
    }
}

android {
    namespace "com.galbrena.fluxdownbridge"
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.galbrena.fluxdownbridge"
        minSdk 26
        targetSdk 37
        versionCode 12
        versionName "1.7.0"
    }

    signingConfigs {
        if (signingPropertiesPath.isPresent()) {
            maintainerRelease {
                storeFile file(releaseSigning.getProperty("storeFile"))
                storePassword releaseSigning.getProperty("storePassword")
                keyAlias releaseSigning.getProperty("keyAlias")
                keyPassword releaseSigning.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingPropertiesPath.isPresent() ? signingConfigs.maintainerRelease : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3:1.5.0-beta02"
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
